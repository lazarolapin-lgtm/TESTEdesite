<div id="custom-controls-gallery"
     class="relative w-full max-w-[800px] mx-auto"
     data-carousel="slide">

    <!-- Carousel -->
    <div class="relative w-full aspect-square overflow-hidden rounded-xl">

        <!-- Item 1 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item="active">
            <img src="imagem1.jpg"
                 alt="Imagem 1"
                 class="absolute inset-0 w-full h-full object-cover">
        </div>

        <!-- Item 2 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="imagem2.jpg"
                 alt="Imagem 2"
                 class="absolute inset-0 w-full h-full object-cover">
        </div>

        <!-- Item 3 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="imagem3.jpg"
                 alt="Imagem 3"
                 class="absolute inset-0 w-full h-full object-cover">
        </div>

        <!-- Item 4 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="imagem4.jpg"
                 alt="Imagem 4"
                 class="absolute inset-0 w-full h-full object-cover">
        </div>

        <!-- Item 5 -->
        <div class="hidden duration-700 ease-in-out" data-carousel-item>
            <img src="imagem5.jpg"
                 alt="Imagem 5"
                 class="absolute inset-0 w-full h-full object-cover">
        </div>

    </div>

    <!-- Botões -->
    <div class="flex justify-center items-center gap-6 pt-4">

        <button type="button"
                class="p-3 rounded-full bg-white/10 backdrop-blur-md hover:bg-white/20 transition"
                data-carousel-prev>
            ←
        </button>

        <button type="button"
                class="p-3 rounded-full bg-white/10 backdrop-blur-md hover:bg-white/20 transition"
                data-carousel-next>
            →
        </button>

    </div>

</div>
